<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعه یار - سامانه هوشمند خطبه‌ها</title>
    <link rel="icon" type="image/png" href="/logo/favicon-96x96.png" />
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #38bdf8;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader-box { text-align: center; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print { body { display: none !important; } }
    </style>
</head>
<body>

    <div class="loader-box" id="loader">
        <div class="spinner"></div>
        <p>در حال بارگذاری ایمن سامانه جمعه‌یار...</p>
    </div>

    
    <div id="secure-vault" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999999; display:none;"></div>

    <script>
        (function() {
            
            function blockShortcuts(e) {
                if (e.keyCode === 123 || 
                   (e.ctrlKey && e.keyCode === 85) ||
                   (e.ctrlKey && e.keyCode === 83) || 
                   (e.ctrlKey && e.keyCode === 80) || 
                   (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                   (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 85))) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }

            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            document.addEventListener('keydown', blockShortcuts, true);

            
            const _0xvault = atob('L3N5c19jb3JlXzlmOGEyYjdjNGQxZS5odG1s');

            (async function bootSecureApp() {
                try {
                    const res = await fetch(_0xvault + '?_ts=' + Date.now());
                    if (!res.ok) throw new Error();
                    const realHTML = await res.text();

                    const vault = document.getElementById('secure-vault');
                    
                   
                    const shadow = vault.attachShadow({ mode: 'closed' });

                    const frame = document.createElement('iframe');
                    frame.id = 'app-viewport';
                    frame.style.width = '100vw';
                    frame.style.height = '100vh';
                    frame.style.border = 'none';
                    frame.style.margin = '0';
                    frame.style.padding = '0';
                    
                    shadow.appendChild(frame);

                    const doc = frame.contentWindow.document;
                    doc.open();
                    doc.write(realHTML);
                    doc.close();

                    
                    doc.addEventListener('contextmenu', e => e.preventDefault(), true);
                    doc.addEventListener('keydown', blockShortcuts, true);

                    
                    vault.style.display = 'block';
                    document.getElementById('loader').style.display = 'none';

                } catch(err) {
                    document.body.innerHTML = '<p style="color:#ef4444;text-align:center;margin-top:20vh;font-family:sans-serif;">خطا در دریافت هسته سامانه. لطفاً صفحه را رفرش کنید.</p>';
                }
            })();
        })();
    </script>
</body>
</html>
