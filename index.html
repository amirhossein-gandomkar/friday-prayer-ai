<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعه یار - سامانه هوشمند خطبه‌ها</title>
    <link rel="icon" type="image/png" href="/logo/favicon-96x96.png" />
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #38bdf8;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader-box { text-align: center; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media print { body { display: none !important; } }
    </style>
</head>
<body>

    <div class="loader-box" id="loader">
        <div class="spinner"></div>
        <p>در حال بارگذاری ایمن سامانه جمعه‌یار...</p>
    </div>

    <script>
        (function() {
            
            document.addEventListener('contextmenu', e => e.preventDefault(), true);

            
            document.addEventListener('keydown', e => {
                if (e.keyCode === 123 || 
                   (e.ctrlKey && e.keyCode === 85) || 
                   (e.ctrlKey && e.keyCode === 83) || 
                   (e.ctrlKey && e.keyCode === 80) || 
                   (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                   (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 85))) {
                    e.preventDefault();
                    return false;
                }
            }, true);

            
            let _realAppPayload = "";
            let _appFrame = null;

            
            const _decoyPayload = `
                <!DOCTYPE html>
                <html lang="fa" dir="rtl">
                <head><meta charset="utf-8"><title>Access Denied</title></head>
                <body style="background:#020617;color:#ef4444;font-family:sans-serif;text-align:center;padding-top:20vh;">
                    <h1>Error 403 - Forbidden</h1>
                    <p>دسترسی به سورس‌کد این سند در حالت آفلاین مسدود شده است.</p>
                </body>
                </html>
            `;

            
            window.addEventListener('blur', function() {
                if (_appFrame && _appFrame.contentDocument) {
                    try {
                       
                        _appFrame.contentDocument.open();
                        _appFrame.contentDocument.write(_decoyPayload);
                        _appFrame.contentDocument.close();
                    } catch (e) {}
                }
            });

            
            window.addEventListener('focus', function() {
                if (_appFrame && _appFrame.contentDocument && _realAppPayload) {
                    try {
                        _appFrame.contentDocument.open();
                        _appFrame.contentDocument.write(_realAppPayload);
                        _appFrame.contentDocument.close();
                    } catch (e) {}
                }
            });

            
            const _0xvault = atob('L3N5c19jb3JlXzlmOGEyYjdjNGQxZS5odG1s');

            
            (async function boot() {
                try {
                    const res = await fetch(_0xvault + '?_ts=' + Date.now());
                    if (!res.ok) throw new Error();
                    _realAppPayload = await res.text();

                    _appFrame = document.createElement('iframe');
                    _appFrame.style.position = 'fixed';
                    _appFrame.style.top = '0';
                    _appFrame.style.left = '0';
                    _appFrame.style.width = '100vw';
                    _appFrame.style.height = '100vh';
                    _appFrame.style.border = 'none';
                    _appFrame.style.zIndex = '999999';
                    
                    document.body.appendChild(_appFrame);

                    _appFrame.contentDocument.open();
                    _appFrame.contentDocument.write(_realAppPayload);
                    _appFrame.contentDocument.close();

                    document.getElementById('loader').style.display = 'none';

                } catch(err) {
                    document.body.innerHTML = '<p style="color:#ef4444;text-align:center;margin-top:20vh;">خطا در دریافت هسته سامانه.</p>';
                }
            })();
        })();
    </script>
</body>
</html>
