<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمعه یار - سامانه هوشمند خطبه‌ها</title>
<link rel="icon" type="image/png" href="/logo/favicon-96x96.png" sizes="96x96" />
<link class="shortcut icon" href="/logo/favicon.ico" />
<link class="hidden-manifest" rel="manifest" href="/logo/site.webmanifest" />
<style>
    body {
        margin: 0; background-color: #020617; color: #38bdf8;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; overflow: hidden;
    }
    .loader-box { text-align: center; }
    .spinner {
        width: 48px; height: 48px; border: 4px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8; border-radius: 50%;
        animation: spin 1s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media print { html, body { display: none !important; } }
</style>
</head>
<body>

<div class="loader-box" id="loader">
    <div class="spinner"></div>
    <p>در حال بارگذاری ایمن سامانه جمعه‌یار...</p>
</div>

<script>
(function () {
    function blockShortcuts(e) {
        var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
        if (e.keyCode === 123 || k === 'f12' ||
            (c && (k === 'u' || k === 's' || k === 'p')) ||
            (c && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) ||
            (e.metaKey && e.altKey && (k === 'i' || k === 'j' || k === 'c' || k === 'u'))) {
            e.preventDefault(); e.stopPropagation(); return false;
        }
    }
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
    document.addEventListener('keydown', blockShortcuts, true);

    var vault = atob('L3N5c19jb3JlXzlmOGEyYjdjNGQxZS5odG1s');
    var frame = null, fDoc = null;
    var saved = null, decoyEl = null, swapped = false, scrollPos = 0;

    // ---- جایگزینی غیرمخرب: محتوای واقعی حذف/بازنویسی نمی‌شود ----
    // هنگام خروج ماوس از لبه بالا (رفتن به منوی کروم)، عنصرهای واقعی فقط موقتاً از سند برداشته و
    // در حافظه نگه داشته می‌شوند و یک صفحه قلابی جایشان می‌نشیند. با برگشت ماوس همان عنصرها
    // (با همه رویدادها، متن‌ها و انیمیشن‌ها) عیناً برمی‌گردند. هیچ اسکریپتی دوباره اجرا نمی‌شود.
    function hideReal() {
        if (swapped || !fDoc || !fDoc.body || fDoc.readyState !== 'complete') return;
        swapped = true;
        try {
            var se = fDoc.scrollingElement || fDoc.documentElement;
            scrollPos = se ? se.scrollTop : 0;
            var h = fDoc.createDocumentFragment(), b = fDoc.createDocumentFragment();
            while (fDoc.head.firstChild) h.appendChild(fDoc.head.firstChild);
            while (fDoc.body.firstChild) b.appendChild(fDoc.body.firstChild);
            saved = { h: h, b: b };
            decoyEl = fDoc.createElement('div');
            decoyEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#020617;color:#94a3b8;font-family:sans-serif;text-align:center;padding-top:20vh;';
            decoyEl.textContent = 'این سند به صورت آفلاین در دسترس نیست.';
            fDoc.body.appendChild(decoyEl);
        } catch (err) { swapped = false; }
    }

    function showReal() {
        if (!swapped || !fDoc || !saved) return;
        try {
            if (decoyEl && decoyEl.parentNode) decoyEl.parentNode.removeChild(decoyEl);
            fDoc.head.appendChild(saved.h);
            fDoc.body.appendChild(saved.b);
            saved = null; decoyEl = null; swapped = false;
            var se = fDoc.scrollingElement || fDoc.documentElement;
            if (se) se.scrollTop = scrollPos;
        } catch (err) { swapped = false; }
    }

    function onLeave(e) { if (e.clientY <= 0) hideReal(); }
    function onOut(e) { if (!e.relatedTarget && e.clientY <= 0) hideReal(); }

    function bind(doc) {
        doc.addEventListener('mouseleave', onLeave);
        doc.documentElement.addEventListener('mouseleave', onLeave);
        doc.addEventListener('mouseout', onOut);
        doc.addEventListener('mouseenter', showReal);
        doc.documentElement.addEventListener('mouseenter', showReal);
        doc.addEventListener('mouseover', showReal);
        doc.addEventListener('mousemove', showReal, true);
    }

    bind(document);

    (async function boot() {
        try {
            var res = await fetch(vault + '?_hash=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error();
            var html = await res.text();

            frame = document.createElement('iframe');
            frame.id = 'app-viewport';
            frame.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;z-index:999999;';
            document.body.appendChild(frame);

            var doc = frame.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
            html = null;

            fDoc = frame.contentDocument || frame.contentWindow.document;
            document.getElementById('loader').style.display = 'none';

            // قفل‌ها و ردیاب ماوس باید بعد از doc.write بسته شوند (open همه شنونده‌ها را پاک می‌کند)
            fDoc.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
            fDoc.addEventListener('keydown', blockShortcuts, true);
            bind(fDoc);
        } catch (err) {
            document.body.innerHTML = '<p style="color:#ef4444;text-align:center;margin-top:20vh;">خطا در دریافت هسته سامانه. لطفاً صفحه را رفرش کنید.</p>';
        }
    })();
})();
</script>
<noscript>برای استفاده از سایت، جاوااسکریپت را فعال کنید.</noscript>
</body>
</html>
