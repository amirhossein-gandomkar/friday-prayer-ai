<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعه یار - سامانه هوشمند خطبه‌ها</title>
    <link rel="icon" type="image/png" href="/logo/favicon-96x96.png" />
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #38bdf8;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader-box { text-align: center; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
       
        @media print { body { display: none !important; } }
    </style>
</head>
<body>

    <div class="loader-box" id="loader">
        <div class="spinner"></div>
        <p>در حال بارگذاری ایمن سامانه جمعه‌یار...</p>
    </div>

    <script>
        (function() {
            
            document.addEventListener('contextmenu', e => e.preventDefault(), true);

            
            document.addEventListener('keydown', e => {
                if (e.keyCode === 123 || 
                   (e.ctrlKey && e.keyCode === 85) || 
                   (e.ctrlKey && e.keyCode === 83) || 
                   (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                   (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 85))) {
                    e.preventDefault();
                    return false;
                }
            }, true);

            
            setInterval(function() {
                const start = performance.now();
                (function() {}['constructor']('debugger')());
                if (performance.now() - start > 100) {
                    document.body.innerHTML = '<div style="background:#020617;color:red;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">دسترسی غیرمجاز مسدود است!</div>';
                }
            }, 200);

            
            const _0xvault = atob('L3N5c19jb3JlXzlmOGEyYjdjNGQxZS5odG1s');

            
            (async function bootSecureApp() {
                try {
                    const res = await fetch(_0xvault + '?_hash=' + Date.now());
                    if (!res.ok) throw new Error();
                    const rawHTML = await res.text();

                    
                    const frame = document.createElement('iframe');
                    frame.id = 'app-viewport';
                    frame.style.position = 'fixed';
                    frame.style.top = '0';
                    frame.style.left = '0';
                    frame.style.width = '100vw';
                    frame.style.height = '100vh';
                    frame.style.border = 'none';
                    frame.style.zIndex = '999999';
                    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads allow-modals');
                    
                    document.body.appendChild(frame);

                    
                    const doc = frame.contentWindow.document;
                    doc.open();
                    doc.write(rawHTML);
                    doc.close();

                    
                    document.getElementById('loader').style.display = 'none';

                } catch(err) {
                    document.body.innerHTML = '<p style="color:#ef4444;text-align:center;margin-top:20vh;">خطا در دریافت هسته سامانه. لطفاً اتصال اینترنت را چک کرده و صفحه را رفرش کنید.</p>';
                }
            })();
        })();
    </script>
</body>
</html>
